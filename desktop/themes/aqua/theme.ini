# Aqua — Mac OS X 10.2 "Jaguar". The default theme, and the product.
#
# PHASE11 P11.2: the look as data. Every token the toolkit reads is set here;
# the compiled defaults in de/aquadraw/Theme.swift are the same values, used
# only when no theme file can be found (and said out loud when they are). A
# unit test holds this file and those defaults equal.
#
# Colours: #rrggbb, #rrggbb/alpha, "r g b [a]" as fractions, or
# mix(a, b, t) in OKLCH (a and b a colour or another token's name).
# Metrics: a number, or "number * parameter". Unknown keys are refused.

[theme]
name = Aqua

[colors]
# Window chrome. Jaguar title bars are a smooth light-grey gradient with a
# near-white top edge and very faint horizontal pinstripes.
titleBarTop = #f4f4f4
titleBarBottom = #cfcfcf
titleBarHighlight = #fdfdfd
titleBarPinstripe = 0 0 0 0.035
titleBarInactiveTop = #f6f6f6
titleBarInactiveBottom = #e2e2e2
windowBorder = #6f6f6f
titleText = #303030
# Content area: the flat light grey of a Jaguar system window. (White +
# pinstripe is the document-window variant, kept available via pinstripe.)
contentBackground = #ececec
pinstripe = #eef2f7/0.6
separator = 0 0 0 0.12
# Traffic lights (close / minimize / zoom): glassy Aqua water-drops.
close = #ff5f52
minimize = #ffbd2e
zoom = #29c440
trafficInactive = #cacaca
trafficRim = 0 0 0 0.22
# Default ("aqua blue") gel button.
buttonBlueTop = #9fc3f6
buttonBlueMid = #4e8df0
buttonBlueBottom = #2061c9
buttonBlueBorder = #1b4f9e
# White gel button.
buttonWhiteTop = #ffffff
buttonWhiteBottom = #d7d7d7
buttonWhiteBorder = #9a9a9a
buttonGloss = 1 1 1 0.55
buttonTextOnBlue = #000000
buttonTextOnWhite = #202020
# Text field: white well with a soft inset top-shadow; the focused variant
# gets the Aqua blue focus ring.
fieldBackground = #ffffff
fieldBorder = #9a9a9a
fieldInsetShadow = 0 0 0 0.14
fieldText = #141414
fieldPlaceholder = #949494
fieldFocusRing = #74a6ee/0.85
fieldCaret = #2061c9
# Controls (checkbox / radio / slider / pop-up / progress). White gel bodies
# share this palette; the "on" state reuses the blue gel button colours.
controlWhiteTop = #ffffff
controlWhiteBottom = #e3e3e3
controlBorder = #8b8b8b
controlInsetShadow = 0 0 0 0.13
controlGlyph = #ffffff
controlLabel = #1a1a1a
sliderTrack = #cccccc
sliderTrackEdge = 0 0 0 0.30
progressTrack = #d6d6d6
groupBoxBorder = 0 0 0 0.16
# Sheet: a modal panel that slides from the title bar; the parent dims.
sheetBackground = #ededed
sheetDim = 0 0 0 0.30
# Tab view: a light pane with rounded-top tabs sitting on its top border.
# The selected tab's bottom matches the pane so it reads as "connected".
tabPaneBackground = #f0f0f0
tabSelectedTop = #ffffff
tabSelectedBottom = #f0f0f0
tabUnselectedTop = #dadada
tabUnselectedBottom = #c4c4c4
tabBorder = #8b8b8b
tabText = #1f1f1f
# Pop-up menu: white sheet, blue selection highlight (classic Aqua menu blue).
menuBackground = #ffffff
menuBorder = #8b8b8b
menuHighlight = #3f6fdf
menuText = #1a1a1a
menuTextOnHighlight = #ffffff
# A command that cannot run now (P10.1): Jaguar's grey, still legible.
menuTextDisabled = #949494
menuSeparator = #d9d9d9
# Menu bar: a light, faintly glassy strip at the top of the screen with a
# 1px darker bottom edge; the open/hovered title takes the menu blue.
menuBarTop = #fcfcfc
menuBarBottom = #ebebeb
menuBarBorder = #a6a6a6
menuBarText = #161616
bodyText = #202020
secondaryText = #6b6b6b
# MARK: Attention
#
# Added for the installer's hub (PHASE5 P5.4), where "this row still needs
# you" has to read differently from "this row is fine" at a glance, without
# making the whole screen shout. Jaguar's own alert accents are this warm
# red on a barely-tinted panel.
attentionText = #9a3b2e
attentionBackground = #fdf4f1
rowBackground = #fbfbfb
# Lists and toolbars (P11.2: these were literals in the Finder and scenes).
listBackground = #ffffff
listStripe = #edf0f7
listHeaderTop = #f6f6f6
listHeaderBottom = #dedede
toolbarTop = #f0f0f0
toolbarBottom = #dcdcdc
toolbarGlyph = #3a3a3a
toolbarSeparator = 0 0 0 0.25
toolbarLabelText = #303030
segmentGlyph = #4a4a4a
controlPressedTop = #c8c8c8
controlPressedBottom = #e4e4e4
statusBarTop = #eaeaea
statusBarBottom = #d8d8d8
prefsToolbarTop = #ededed
prefsToolbarBottom = #d8d8d8
sectionTitleText = #1a1a1a
iconLabelText = #202020
# Sheets, toasts and veils.
sheetShadow = 0 0 0 0.18
toastShadow = 0 0 0 0.18
toastTop = #fdfdfd/0.96
toastBottom = #e6e8ec/0.96
toastPinstripe = #d8dbe0/0.45
toastBorder = #8a8f96/0.9
systemMark = #4a6fa5
disabledVeil = 0.93 0.93 0.93 0.62
statusGlyphCutout = 1 1 1 0.9
# The desktop and the Dock.
desktopTop = 0.36 0.52 0.75
desktopMiddle = 0.20 0.34 0.58
desktopBottom = 0.11 0.21 0.42
desktopGlow = 0.68 0.80 0.96 0.55
desktopLabelText = 1 1 1
desktopLabelShadow = 0 0 0 0.55
dockShelfTop = 1 1 1 0.55
dockShelfBottom = 0.86 0.88 0.92 0.5
dockShelfBorder = 0 0 0 0.28
dockSeparator = 0 0 0 0.22
dockRunningMark = 0.1 0.1 0.1 0.85
dockLabelBackground = 0.12 0.12 0.14 0.9
dockLabelText = 1 1 1
# The compositor's frames.
inactiveFrameWash = 1 1 1 0.35
# Accents and materials beyond Jaguar's (P11.9) — Aqua's lists do not read them.
glowFocus = #74a6ee
glowSelect = #3f6fdf
bevelLight = #ffffff/0.6
bevelShade = #000000/0.35
readoutBackground = #2b2b2b
readoutText = #9ee06b
ledOn = #3cc43c
ledWarn = #e8a33a
alert = #d6453b

[metrics]
titleBarHeight = 22
windowCornerRadius = 7
trafficRadius = 6.5
trafficSpacing = 20
trafficInset = 10
chrome.border = 1
chrome.resizeBand = 6
chrome.resizeCorner = 14
chrome.pillWidth = 22
chrome.pillHeight = 13
chrome.pillInset = 8
chrome.titleSize = 13
icon.smallBelow = 24

# Layout: toasts
toast.width = 300
toast.topInset = 8
toast.rightInset = 12
toast.gap = 8
toast.padX = 14
toast.padY = 11
toast.summarySize = 13
toast.bodySize = 12
toast.lineHeight = 16
toast.corner = 10
toast.baseHeight = 42
toast.maxBodyLines = 4

# Layout: desktop icons
desktop.cellW = 96
desktop.cellH = 84
desktop.iconSize = 48
desktop.margin = 12
desktop.topInset = 26

# Layout: the Finder
finder.toolbarHeight = 36
finder.statusHeight = 18
finder.scrollbarWidth = 15
finder.iconSize = 48
finder.cellW = 88
finder.cellH = 76
finder.gridPad = 10
finder.rowHeight = 18
finder.listIcon = 14

# Layout: the menu bar
menuBar.height = 22
menuBar.leftMargin = 8
menuBar.systemSlot = 26
menuBar.titlePadX = 9
menuBar.clockMarginRight = 14
menuBar.fontSize = 13

# Layout: the Dock
dock.gap = 6
dock.maxScale = 1.9
dock.panelPadV = 6
dock.panelPadH = 12
dock.bottomMargin = 6

# Layout: menus
menu.itemHeight = 20.0
menu.separatorHeight = 12.0
menu.padV = 4.0
menu.titleX = 22.0
menu.keyGap = 28.0
menu.rightInset = 14.0

# Layout: menu-bar status items
status.volumeWidth = 22
status.batteryWidth = 46
status.gap = 6
status.clockGap = 10

[fonts]
fontFamily = Lucida Grande
# A family per role (P11.7), found by name. Jaguar's faces do not ship free, so
# on this desktop each falls back to the default chain, and says so.
interface = Lucida Grande
chrome = Lucida Grande
readout = Lucida Grande
mono = Monaco
fontSize = 13

# The window frame (P11.6). Gadgets, left to right on each side: close,
# minimize, zoom, depth (send to back), pill (the toolbar toggle — drawn only
# on the toolkit's own windows, which have a toolbar to toggle). Jaguar: the
# three lights on the left, the pill on the right, the title centred.
[chrome]
left = close minimize zoom
right = pill
title = center
titleWeight = regular
