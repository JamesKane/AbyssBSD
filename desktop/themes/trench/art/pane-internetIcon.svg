<!-- Trench pane icon "internetIcon" (BACKLOG §5): Internet: a globe, and something circling it. Drawn for System
     Preferences in the study's idiom (three-quarter view, a heavy outline,
     lit from the top left, a soft cast shadow; the "neon" scheme), and
     imported into icons/prefs.dl with abyss/tools/svg2dl. -->
