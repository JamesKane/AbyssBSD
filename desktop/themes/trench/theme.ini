[metrics]
titleBarHeight = 24
windowCornerRadius = 0
trafficRadius = 9
trafficSpacing = 22
trafficInset = 3
chrome.border = 1
chrome.resizeBand = 6
chrome.resizeCorner = 14
chrome.pillWidth = 22
chrome.pillHeight = 13
chrome.pillInset = 8
chrome.titleSize = 12
menuBar.height = 26
menu.itemHeight = 23
fontSize = 13

[fonts]
fontFamily = IBM Plex Sans Condensed
interface = IBM Plex Sans Condensed
chrome = Chakra Petch
readout = VT323
mono = IBM Plex Mono
# "Uppercase with wide tracking" — title bars, menu titles, legends, buttons.
chrome.upper = true
chrome.tracking = 0.14

# Amiga gadgets: close on the left, zoom and depth on the right.
[chrome]
left = close
right = zoom depth
title = center
titleWeight = bold
