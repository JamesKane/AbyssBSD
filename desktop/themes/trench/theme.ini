# Trench — the Plan Neo look (PHASE11 P11.9), the second theme, and the test
# the format can fail. Tokens are the Plan Neo chrome study's (claude.ai/
# artifact/M4LEDkHLwxppcSSk6gsR7E) verbatim: `neon` here, `neon-hc` and
# `daylight` as schemes. No Swift knows this theme's name (PRODUCT §8.3);
# golden.sh checks that.
[theme]
name = Trench
default_scheme = neon

# The study's knobs: --gk (glow), --bloom (the LCD's), --bevel (px).
[parameters]
gk = 0.6 0 1
bloom = 1 0 1
bevel = 1 0 3

