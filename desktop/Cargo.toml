# ADE in Rust (docs/RUST.md): one workspace, a crate beside each Swift target
# it replaces (de/<name>/Cargo.toml), `unsafe` only in *-sys crates, and no
# dependencies beyond libc and cc (§6.5).
[workspace]
resolver = "3"
members = ["de/abyss-sys", "de/abyssclip", "de/abyssctl", "de/abyssgrab", "de/abyssmenu", "de/abyssnotify", "de/abyssopen", "de/abysstheme", "de/agent", "de/agentbin", "de/anchor", "de/anchorbin", "de/appbundles", "de/appgen", "de/aqua", "de/aquademo", "de/aquadraw", "de/currentipc", "de/dbus", "de/dbusbin", "de/dbusbridge", "de/dbusmenus", "de/dbusportal", "de/dbusprobe", "de/displaysctl", "de/fathom", "de/fathombin", "de/fetch", "de/fetchbin", "de/idlebin", "de/install", "de/installbin", "de/installctl", "de/installrun", "de/installwire", "de/ipcprobe", "de/jaild", "de/jaildbin", "de/jailctl", "de/jailkeeper", "de/jails", "de/login", "de/loginctl", "de/loginstub", "de/loginwindowbin", "de/menumodel", "de/menuwire", "de/model", "de/modelbin", "de/poolconfig", "de/portal", "de/portalbin", "de/pty", "de/settings", "de/settingsbin", "de/settingsctl", "de/settingsrun", "de/settingswire", "de/spawn", "de/surface", "de/systemfacts", "de/terminal", "de/textmodel", "de/undertow", "de/undertowbin", "de/vents", "de/ventsctl", "de/volumes", "de/vocab", "de/vocabbin", "de/vtbin"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
libc = "0.2"
cc = "1"
abyss-sys = { path = "de/abyss-sys" }
