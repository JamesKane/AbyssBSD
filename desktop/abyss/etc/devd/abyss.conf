# AbyssBSD — the machine's lid and buttons go to the session (PHASE16 P16.4b).
#
# devd runs these as root, so `abyss-loginctl power lid|sleep-key|power-key`
# is the system speaking; the daemon accepts these three from root only.
#
#   the lid closing   → sleep, every session locked first (the daemon's rule)
#   the sleep key     → the same
#   the power key     → each session asks: Restart, Sleep, Cancel, Shut Down;
#                       with no session to ask, the machine shuts down
#
# The kernel's own handling of the power key (hw.acpi.power_button_state,
# "poweroff" by default) is set to NONE by abyss_loginwindow while the daemon
# runs — or the machine would be off before anyone was asked — and put back
# when it stops.

notify 10 {
	match "system"		"ACPI";
	match "subsystem"	"Lid";
	match "notify"		"0x00";
	action "/usr/local/bin/abyss-loginctl power lid";
};

notify 10 {
	match "system"		"ACPI";
	match "subsystem"	"Button";
	match "notify"		"0x00";
	action "/usr/local/bin/abyss-loginctl power power-key";
};

notify 10 {
	match "system"		"ACPI";
	match "subsystem"	"Button";
	match "notify"		"0x01";
	action "/usr/local/bin/abyss-loginctl power sleep-key";
};
