# RUST.md R0: lang/rust IGNOREs under qemu-user-static, so nothing in the
# riscv64 set may need it. C librsvg2 for gtk3; no XWayland (PRODUCT 5.2).
DEFAULT_VERSIONS+=	librsvg2=legacy
x11-toolkits_wlroots020_UNSET=	X11
# colord needs sqlite3, whose post-install runs ldd -a on its binary, which
# qemu-user-static 3.1 cannot (ld-elf: mmap of entire address space failed).
# ADE asks nothing of colord. gtk30's DOCS run gtkdoc-mkhtml emulated, and
# it fails at stage; nothing here reads them.
x11-toolkits_gtk30_UNSET=	COLORD DOCS
# llvm19 (for mesa) runs its tablegens under emulation; twelve at once
# exhausted the builder VM's 14G (code 137) on 2026-10-30.
.if ${.CURDIR:M*/devel/llvm19}
MAKE_JOBS_NUMBER=	4
.endif
