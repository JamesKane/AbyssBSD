# A test theme (PHASE11 P11.6): Aqua in every token and list, with a frame
# laid out differently — the depth gadget beside the pill on the right, and a
# bold title on the left, and Plan Neo's four families by role (P11.7). It
# exists to put the layout function's other answers, and type by role, under
# the golden gate and the live tests.
[theme]
name = Chrome Test

[chrome]
left = close minimize zoom
right = depth pill
title = left
titleWeight = bold

[fonts]
interface = IBM Plex Sans Condensed
chrome = Chakra Petch
readout = VT323
mono = IBM Plex Mono
