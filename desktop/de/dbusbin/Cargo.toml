[package]
name = "dbusbin"
description = "abyss-dbus: ADE's D-Bus bridge, the desktop's portal on it, and the GTK menu bridge (Swift: main.swift beside it)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "abyss-dbus"
path = "src/main.rs"

[dependencies]
abyss-sys.workspace = true
current-ipc = { path = "../currentipc" }
dbus = { path = "../dbus" }
dbusbridge = { path = "../dbusbridge" }
dbusmenus = { path = "../dbusmenus" }
dbusportal = { path = "../dbusportal" }
pool-config = { path = "../poolconfig" }
